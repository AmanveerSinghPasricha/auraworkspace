name: Aura Gateway CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

# 1. Concurrency control to auto-cancel stale/duplicate runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 2. Principle of Least Privilege: Token permissions strictly limited to read
permissions:
  contents: read

# 3. Sets default working directory for all `run:` shell steps
defaults:
  run:
    working-directory: aura-gateway-core

jobs:
  test-and-build:
    name: 🧪 Run Test Suite & Verify Docker Build
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.13 environment
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'aura-gateway-core/requirements.txt'

      # Step 3: Install system dependencies (Poppler/Tesseract for document processing)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr

      # Step 4: Install Python package dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 5: Execute full Pytest test suite using Fallback Secrets & Async SQLite Memory DB
      - name: Run Pytest test suite
        env:
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY || 'test_secret_key_32_bytes_long_exact!!' }}
          ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          python -m pytest -v

      # Step 6: Set up Docker Buildx for container verification
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 7: Verify Docker container image builds successfully without pushing
      - name: Verify Docker Build
        uses: docker/build-push-action@v6
        with:
          context: ./aura-gateway-core
          file: ./aura-gateway-core/Dockerfile
          push: false
          tags: aura-gateway-core:test