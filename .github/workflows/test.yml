name: Aura Gateway CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: aura-gateway-core

jobs:
  test-and-build:
    name: 🧪 Run Test Suite & Verify Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'aura-gateway-core/requirements.txt'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest test suite
        env:
          APP_ENV: "testing"
          ENVIRONMENT: "testing"
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY || 'test_secret_key_32_bytes_long_exact!!' }}
          ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          NEON_DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'gsk_mock_dummy_key_for_ci_builds' }}
          OPENAI_API_KEY: "sk-mock-dummy-key-for-testing-purposes-only"
        run: |
          python -m pytest -v --tb=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Build
        uses: docker/build-push-action@v6
        with:
          context: ./aura-gateway-core
          file: ./aura-gateway-core/Dockerfile
          push: false
          tags: aura-gateway-core:test